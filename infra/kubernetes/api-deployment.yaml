apiVersion: apps/v1
kind: Deployment
metadata:
  name: heatwave-api
  namespace: heatwave
  labels:
    app: heatwave-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heatwave-api
  template:
    metadata:
      labels:
        app: heatwave-api
    spec:
      containers:
        - name: api
          image: heatwave-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: heatwave-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: heatwave-secrets
                  key: redis-url
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
