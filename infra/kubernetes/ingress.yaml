apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heatwave-ingress
  namespace: heatwave
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: heatwave.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: heatwave-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heatwave-web
                port:
                  number: 3000
