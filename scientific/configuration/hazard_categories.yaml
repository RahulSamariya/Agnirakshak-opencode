hazard_categories:
  version: "1.0.0"
  description: "UTCI-based hazard category thresholds"
  categories:
    no_stress:
      min: 9
      max: 26
      hazard_min: 0.0
      hazard_max: 0.25
      label: "No thermal stress"
    moderate_heat:
      min: 26
      max: 32
      hazard_min: 0.25
      hazard_max: 0.50
      label: "Moderate heat stress"
    strong_heat:
      min: 32
      max: 38
      hazard_min: 0.50
      hazard_max: 0.75
      label: "Strong heat stress"
    very_strong_heat:
      min: 38
      max: 46
      hazard_min: 0.75
      hazard_max: 1.00
      label: "Very strong heat stress"
    extreme_heat:
      min: 46
      max: null
      hazard_min: 1.00
      hazard_max: 1.00
      label: "Extreme heat stress"
